services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: TestApiDb
      MYSQL_ROOT_PASSWORD: cokguclu123!
    volumes:
      - mysqldata:/var/lib/mysql
    restart: always

  api:
    build:
      context: .
      dockerfile: DockerTestApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DockerMySql=server=mysql;port=3306;database=TestApiDb;user=root;password=cokguclu123!
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  mysqldata: